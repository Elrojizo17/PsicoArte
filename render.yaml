services:
  - type: web
    name: psicoarte-api
    runtime: python
    rootDir: Backend
    plan: free
    buildCommand: bash build.sh
    startCommand: python manage.py migrate && python -m gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --workers 1 --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://psico-arte-sigma.vercel.app
      - key: DATABASE_URL
        sync: false
